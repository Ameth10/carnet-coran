<style>

.split{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}

}

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
"use strict";
const SOURATES=[["Al-Fatiha","الفاتحة",7],["Al-Baqara","البقرة",286],["Al-Imran","آل عمران",200],["An-Nisa","النساء",176],["Al-Ma'ida","المائدة",120],["Al-An'am","الأنعام",165],["Al-A'raf","الأعراف",206],["Al-Anfal","الأنفال",75],["At-Tawba","التوبة",129],["Yunus","يونس",109],["Hud","هود",123],["Yusuf","يوسف",111],["Ar-Ra'd","الرعد",43],["Ibrahim","إبراهيم",52],["Al-Hijr","الحجر",99],["An-Nahl","النحل",128],["Al-Isra","الإسراء",111],["Al-Kahf","الكهف",110],["Maryam","مريم",98],["Ta-Ha","طه",135],["Al-Anbiya","الأنبياء",112],["Al-Hajj","الحج",78],["Al-Mu'minun","المؤمنون",118],["An-Nur","النور",64],["Al-Furqan","الفرقان",77],["Ash-Shu'ara","الشعراء",227],["An-Naml","النمل",93],["Al-Qasas","القصص",88],["Al-Ankabut","العنكبوت",69],["Ar-Rum","الروم",60],["Luqman","لقمان",34],["As-Sajda","السجدة",30],["Al-Ahzab","الأحزاب",73],["Saba","سبأ",54],["Fatir","فاطر",45],["Ya-Sin","يس",83],["As-Saffat","الصافات",182],["Sad","ص",88],["Az-Zumar","الزمر",75],["Ghafir","غافر",85],["Fussilat","فصلت",54],["Ash-Shura","الشورى",53],["Az-Zukhruf","الزخرف",89],["Ad-Dukhan","الدخان",59],["Al-Jathiya","الجاثية",37],["Al-Ahqaf","الأحقاف",35],["Muhammad","محمد",38],["Al-Fath","الفتح",29],["Al-Hujurat","الحجرات",18],["Qaf","ق",45],["Adh-Dhariyat","الذاريات",60],["At-Tur","الطور",49],["An-Najm","النجم",62],["Al-Qamar","القمر",55],["Ar-Rahman","الرحمن",78],["Al-Waqi'a","الواقعة",96],["Al-Hadid","الحديد",29],["Al-Mujadila","المجادلة",22],["Al-Hashr","الحشر",24],["Al-Mumtahana","الممتحنة",13],["As-Saff","الصف",14],["Al-Jumu'a","الجمعة",11],["Al-Munafiqun","المنافقون",11],["At-Taghabun","التغابن",18],["At-Talaq","الطلاق",12],["At-Tahrim","التحريم",12],["Al-Mulk","الملك",30],["Al-Qalam","القلم",52],["Al-Haqqa","الحاقة",52],["Al-Ma'arij","المعارج",44],["Nuh","نوح",28],["Al-Jinn","الجن",28],["Al-Muzzammil","المزمل",20],["Al-Muddaththir","المدثر",56],["Al-Qiyama","القيامة",40],["Al-Insan","الإنسان",31],["Al-Mursalat","المرسلات",50],["An-Naba","النبأ",40],["An-Nazi'at","النازعات",46],["Abasa","عبس",42],["At-Takwir","التكوير",29],["Al-Infitar","الانفطار",19],["Al-Mutaffifin","المطففين",36],["Al-Inshiqaq","الانشقاق",25],["Al-Buruj","البروج",22],["At-Tariq","الطارق",17],["Al-A'la","الأعلى",19],["Al-Ghashiya","الغاشية",26],["Al-Fajr","الفجر",30],["Al-Balad","البلد",20],["Ash-Shams","الشمس",15],["Al-Layl","الليل",21],["Ad-Duha","الضحى",11],["Ash-Sharh","الشرح",8],["At-Tin","التين",8],["Al-Alaq","العلق",19],["Al-Qadr","القدر",5],["Al-Bayyina","البينة",8],["Az-Zalzala","الزلزلة",8],["Al-Adiyat","العاديات",11],["Al-Qari'a","القارعة",11],["At-Takathur","التكاثر",8],["Al-Asr","العصر",3],["Al-Humaza","الهمزة",9],["Al-Fil","الفيل",5],["Quraysh","قريش",4],["Al-Ma'un","الماعون",7],["Al-Kawthar","الكوثر",3],["Al-Kafirun","الكافرون",6],["An-Nasr","النصر",3],["Al-Masad","المسد",5],["Al-Ikhlas","الإخلاص",4],["Al-Falaq","الفلق",5],["An-Nas","الناس",6]];
const JOURS=["Dimanche","Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"];
const ETATS={en_cours:"En cours",acquise:"Acquise",a_revoir:"À revoir"};
const ETAT_CHIP={en_cours:"enc",acquise:"acq",a_revoir:"rev"};
const ERREURS=["Makhraj","Madd","Ghunna","Idgham","Ikhfa","Qalqala","Harakat","Waqf","Hésitation","Oubli de verset","Fluidité"];
const TYPES={memo:"Mémorisation",lecture:"Lecture",tajwid:"Tajwid",revision:"Révision"};
const BLOC_COULEURS=["#d7e3cf","#f2d6cf","#d5e1ec","#f0dfc3","#e2d9ec","#d3e8e4"];
const DEFAUT_ACCUEIL="Salam Aleykoum {parent},\n\nBienvenue à {prenom} ! Ses cours auront lieu {creneau} sur Zoom :\n{zoom}\n\nBarakAllahu fikoum\n{prof}";
const DEFAUT_ACCUEIL_ADULTE="Salam Aleykoum {prenom},\n\nBienvenue ! Vos cours auront lieu {creneau} sur Zoom :\n{zoom}\n\nBarakAllahu fikoum\n{prof}";

const S={eleves:{},seances:{},fichiers:{},paiements:{},reglages:{}};
const COLS=Object.keys(S);
let DB=null,ASSETS=null,DL=null,MODE="local",READY=false;
let R={view:"today"};
let DRAFT=null,PAD=null,PEN={c:"#1f2a24",w:2.4},PENDING=false,CHRONO=null;
const EDIT_VIEWS=new Set(["form","planning","cours"]);

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const sN=n=>n?SOURATES[n-1][0]:"";
const sAr=n=>n?SOURATES[n-1][1]:"";
const moisKey=(d=new Date())=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
const fmtDate=iso=>new Date(iso).toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"});
const fmtLong=iso=>new Date(iso).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
const fmtMois=k=>{const[y,m]=k.split("-");return new Date(+y,+m-1,1).toLocaleDateString("fr-FR",{month:"long",year:"numeric"})};
const euro=n=>(Math.round((+n||0)*100)/100).toLocaleString("fr-FR",{style:"currency",currency:"EUR"});
const reg=()=>S.reglages.main||{};
const eleves=()=>Object.entries(S.eleves).map(([id,e])=>({id,...e})).sort((a,b)=>(a.prenom||"").localeCompare(b.prenom||"","fr"));
const seancesDe=id=>Object.entries(S.seances).map(([sid,s])=>({id:sid,...s})).filter(s=>s.eleveId===id).sort((a,b)=>b.date.localeCompare(a.date));
const blobUrl=id=>!id?"":id.startsWith("data:")?id:id.startsWith("idb:")?(URLS[id]||""):"/_blob/"+id;
const creneauTxt=c=>c?JOURS[c.jour].toLowerCase()+" "+(c.heure||"").replace(":","h"):"";
const creneauxTxt=e=>(e.creneaux||[]).map(creneauTxt).join(", ");
const nomComplet=e=>[e.prenom,e.nom].filter(Boolean).join(" ");
/* un enfant dont on écrit au parent : on parle de l'enfant ; sinon on s'adresse à l'élève directement */
const enf=e=>e.categorie==="enfant"&&!!e.parent;
const salut=e=>"Salam Aleykoum "+(enf(e)?e.parent:e.prenom)+",";
const listeErreurs=()=>reg().erreurs&&reg().erreurs.length?reg().erreurs:ERREURS;

function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3200)}

/* ---------- stockage ---------- */
const QUEUE={};
function save(col,id,data){
  S[col]={...S[col],[id]:data};
  if(DB){const k=col+"/"+id;QUEUE[k]=(QUEUE[k]||Promise.resolve()).then(()=>{const cur=S[col][id];if(cur)return DB.collection(col).doc(id).set(cur)}).catch(e=>toast("Enregistrement impossible ("+(e&&e.code||"erreur")+"). Réessayez."))}
  else persistLocal(col);
}
function remove(col,id){
  const c={...S[col]};delete c[id];S[col]=c;
  if(DB){const k=col+"/"+id;QUEUE[k]=(QUEUE[k]||Promise.resolve()).then(()=>DB.collection(col).doc(id).delete()).catch(()=>toast("Suppression impossible. Réessayez."))}
  else persistLocal(col);
}
/* Fichier ouvert sur la tablette : tout est gardé dans le navigateur (IndexedDB), fichiers compris */
let IDB=null;const URLS={};
function idbOpen(){return new Promise((ok,ko)=>{const r=indexedDB.open("carnet-coran",1);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains("kv"))d.createObjectStore("kv");if(!d.objectStoreNames.contains("files"))d.createObjectStore("files")};r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)})}
function idb(store,mode,fn){return new Promise((ok,ko)=>{const tx=IDB.transaction(store,mode),r=fn(tx.objectStore(store));tx.oncomplete=()=>ok(r&&r.result);tx.onerror=()=>ko(tx.error);tx.onabort=()=>ko(tx.error)})}
const PERSIST={};
function persistLocal(col){
  if(!IDB){try{localStorage.setItem("carnet-coran",JSON.stringify(S))}catch(e){}return}
  clearTimeout(PERSIST[col]);PERSIST[col]=setTimeout(()=>idb("kv","readwrite",st=>st.put(S[col],col)).catch(()=>toast("Enregistrement impossible : la mémoire de la tablette est peut-être pleine.")),150);
}
async function loadLocal(){
  try{IDB=await idbOpen()}catch(e){IDB=null}
  if(!IDB){try{const d=JSON.parse(localStorage.getItem("carnet-coran")||"null");if(d)COLS.forEach(c=>S[c]=d[c]||{})}catch(e){}return}
  for(const c of COLS){const v=await idb("kv","readonly",st=>st.get(c));if(v)S[c]=v}
  await new Promise(ok=>{const tx=IDB.transaction("files","readonly");tx.objectStore("files").openCursor().onsuccess=ev=>{const cur=ev.target.result;if(cur){URLS["idb:"+cur.key]=URL.createObjectURL(cur.value);cur.continue()}};tx.oncomplete=ok;tx.onerror=ok});
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
}
async function upload(file,type){
  if(ASSETS){const r=await ASSETS.upload(file,type?{type}:undefined);return r.id}
  if(IDB){const id=uid();await idb("files","readwrite",st=>st.put(file,id));URLS["idb:"+id]=URL.createObjectURL(file);return "idb:"+id}
  if(file.size>1.5e6)throw new Error("trop gros");
  return await new Promise((ok,ko)=>{const fr=new FileReader();fr.onload=()=>ok(fr.result);fr.onerror=ko;fr.readAsDataURL(file)});
}
async function delAsset(id){
  if(!id||id.startsWith("data:"))return;
  if(id.startsWith("idb:")){if(IDB)try{await idb("files","readwrite",st=>st.delete(id.slice(4)))}catch(e){}if(URLS[id]){URL.revokeObjectURL(URLS[id]);delete URLS[id]}return}
  if(ASSETS)try{await ASSETS.delete(id)}catch(e){}
}
const MIMES={pdf:"application/pdf",png:"image/png",jpg:"image/jpeg",json:"application/json",m4a:"audio/mp4",mp4:"audio/mp4",mp3:"audio/mpeg",webm:"audio/webm",ogg:"audio/ogg",wav:"audio/wav",aac:"audio/aac"};
let OFFRE=null;
async function saveFile(filename,blob){
  if(DL){
    try{await DL.save({filename,data:blob});return true}
    catch(e){if(e&&e.code==="declined")return false;toast("Téléchargement impossible ("+(e&&e.code||"erreur")+").");return false}
  }
  const ext=(filename.match(/\.([a-z0-9]+)$/i)||[])[1]||"";
  OFFRE={filename,file:new File([blob],filename,{type:blob.type||MIMES[ext.toLowerCase()]||"application/octet-stream"})};
  const el=$("#offre");el.querySelector(".nm").textContent=filename;
  let ok=false;try{ok=!!(navigator.canShare&&navigator.canShare({files:[OFFRE.file]}))}catch(e){}
  el.querySelector('[data-act="partager"]').hidden=!ok;el.hidden=false;
  return true;
}

    </div></div>
    <div class="grid">
      <div class="tile"><div class="lab">Où on en est</div><div>${esc(e.ouOnEnEst||"—")}</div>${e.reprise?`<div class="small muted">Prochaine lecture : ${esc(sN(e.reprise.s))} ${e.reprise.v}</div>`:""}</div>

    </div>
    <div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Planning et objectifs</h2><div class="row"><button class="btn sm" data-act="planning" data-id="${e.id}">Modifier</button><button class="btn sm" data-act="imgplanning" data-id="${e.id}">${I.img}Image du planning</button></div></div>
      ${(e.planning||[]).length?`<div class="row" style="margin-top:10px">${e.planning.map((b,i)=>`<span class="chip" style="background:${BLOC_COULEURS[i%6]};border-color:transparent;color:#1f2a24">${esc(b.min)} min · ${esc(b.titre)}</span>`).join("")}<span class="muted small">Total ${e.planning.reduce((a,b)=>a+(+b.min||0),0)} min par jour</span></div>`:`<p class="muted small">Pas encore de planning.</p>`}
      ${e.sourateSemaine?`<p class="small" style="margin:8px 0 0">Sourate de la semaine : <b>${esc(sN(e.sourateSemaine))}</b> <span class="ar">${sAr(e.sourateSemaine)}</span></p>`:""}
      ${(e.objectifs||[]).length?`<ul class="small" style="margin:8px 0 0;padding-left:18px">${e.objectifs.map(o=>`<li dir="auto">${esc(o)}</li>`).join("")}</ul>`:""}
      ${R.planningPret===e.id?`<div class="banner green" style="margin-top:10px">Image enregistrée. Joignez-la dans WhatsApp avec ce message :<div class="row" style="margin-top:8px"><a class="btn wa" href="${esc(waLink(e.tel,salut(e)+"\n\n"+(enf(e)?`Voici le planning de révision de ${e.prenom}.`:"Voici votre planning de révision.")+(zoom?`\n\nLien Zoom des cours :\n${zoom}`:"")+`\n\nBarakAllahu fikoum`))}" target="_blank" rel="noopener">${I.wa}Ouvrir WhatsApp</a></div></div>`:""}

      ${R.editSour?`<p class="muted small">Touchez une sourate pour changer son état : en cours, acquise, à revoir, puis aucun.</p><div class="sgrid">${SOURATES.map((s,i)=>i+1).reverse().map(n=>`<button class="sbtn ${e.sourates&&e.sourates[n]||""}" data-act="cycle" data-n="${n}"><span class="n">${n}</span> ${esc(sN(n))}<br><span class="ar">${sAr(n)}</span>${e.sourates&&e.sourates[n]?` · <span class="small">${ETATS[e.sourates[n]]}</span>`:""}</button>`).join("")}</div>`
      :["en_cours","acquise","a_revoir"].map(k=>{const l=parEtat(k);return l.length?`<div style="margin-top:10px"><div class="lab small muted">${ETATS[k]} (${l.length})</div><div class="row" style="margin-top:4px">${l.map(n=>`<span class="chip ${ETAT_CHIP[k]}">${esc(sN(n))} <span class="ar">${sAr(n)}</span></span>`).join("")}</div></div>`:""}).join("")||`<p class="muted small">Aucune sourate suivie pour l'instant.</p>`}
    </div>
    <div class="card"><h2>Historique des cours</h2>${ss.length?`<div class="list">${ss.map(s=>`<div class="li clickable" data-act="bilan" data-id="${s.id}"><div class="grow"><div><b>${esc(fmtDate(s.date))}</b> · ${esc(TYPES[s.type]||"")} ${s.pdf?'<span class="pill blue">PDF</span>':""} ${s.paye?'<span class="pill">payé</span>':""}</div><div class="muted small">${esc(resumeCourt(s))}</div></div></div>`).join("")}</div>`:`<p class="muted small">Les cours notés apparaîtront ici.</p>`}</div>

    </div>
    <div class="card"><h2>Notes</h2><p class="small" dir="auto" style="white-space:pre-wrap;margin:0">${esc(e.notes||"—")}</p></div>
    <div class="row">${R.confirmDel===e.id?`<span class="small">Supprimer ${esc(e.prenom)}, ses cours et ses comptes rendus ? C'est définitif.</span><button class="btn danger" data-act="supprimer" data-id="${e.id}">Oui, supprimer</button><button class="btn" data-act="annulerdel">Annuler</button>`:`<button class="btn danger sm" data-act="askdel" data-id="${e.id}">Supprimer l'élève</button>`}
      <button class="btn sm" data-act="actif" data-id="${e.id}">${e.actif===false?"Reprendre le suivi":"Marquer comme arrêté"}</button></div>
  </div>`;
}
function optSourates(sel,vide="—"){return `<option value="">${vide}</option>`+SOURATES.map((s,i)=>`<option value="${i+1}" ${+sel===i+1?"selected":""}>${i+1}. ${esc(s[0])} · ${s[1]}</option>`).join("")}
function vForm(){

  const cr=(e.creneaux&&e.creneaux.length?e.creneaux:[{jour:1,heure:""}]);
  return `<form class="stack" id="fEleve" novalidate>

    <div class="card stack">
      <div class="grid">
        <label class="f">Prénom<input name="prenom" id="f-prenom" required value="${esc(e.prenom||"")}" placeholder="Mouhamed"></label>
        <label class="f">Nom<input name="nom" id="f-nom" value="${esc(e.nom||"")}" placeholder="Diallo"></label>
        <label class="f">Adulte ou enfant<select name="categorie" id="f-cat"><option value="enfant" ${e.categorie==="enfant"?"selected":""}>Enfant</option><option value="adulte" ${e.categorie==="adulte"?"selected":""}>Adulte</option></select></label>

        <label class="f">Téléphone WhatsApp${e.categorie==="adulte"?"":" du parent"}<input name="tel" id="f-tel" inputmode="tel" value="${esc(e.tel||"")}" placeholder="06 12 34 56 78"></label>

        <label class="f">Où on en est<input name="ouOnEnEst" id="f-ou" value="${esc(e.ouOnEnEst||"")}" placeholder="Al-Fil, verset 3"></label>
      </div>
    </div>
    <div class="card stack"><h2 style="margin:0">Créneaux et tarif</h2>
      <div id="creneaux" class="stack">${cr.map((c,i)=>`<div class="row"><select name="jour${i}" id="f-jour${i}" style="flex:1;min-width:120px">${JOURS.map((j,k)=>`<option value="${k}" ${+c.jour===k?"selected":""}>${j}</option>`).join("")}</select><input type="time" name="heure${i}" id="f-heure${i}" value="${esc(c.heure||"")}" style="flex:1;min-width:110px"></div>`).join("")}</div>

        <label class="f">Durée du cours (min)<input type="number" min="5" step="5" name="duree" id="f-duree" value="${esc(e.duree||"")}"></label>

      </div>
    </div>
    <div class="card"><label class="f">Notes personnelles<textarea name="notes" id="f-notes" dir="auto" placeholder="Ce que vous voulez retenir sur cet élève">${esc(e.notes||"")}</textarea></label></div>

  </form>`;
}
function vPlanning(){
  const e=S.eleves[R.id];if(!e)return "";
  const P=R.tmp||(R.tmp={planning:(e.planning||[]).map(b=>({...b})),objectifs:(e.objectifs||[]).join("\n"),sourateSemaine:e.sourateSemaine||""});
  if(!P.planning.length)P.planning.push({titre:"",min:10});
  return `<form class="stack" id="fPlanning">
    <div class="row"><button type="button" class="btn ghost sm" data-act="eleve" data-id="${R.id}">${I.back}Annuler</button></div>

      ${P.planning.map((b,i)=>`<div class="row"><span style="width:14px;height:14px;border-radius:4px;background:${BLOC_COULEURS[i%6]};flex-shrink:0"></span><input id="b-t${i}" data-bloc="${i}" data-k="titre" value="${esc(b.titre)}" placeholder="Réviser Koursiyou et Lakad Diakoum" dir="auto" style="flex:3;min-width:160px"><input id="b-m${i}" data-bloc="${i}" data-k="min" type="number" min="1" value="${esc(b.min)}" style="flex:1;min-width:70px;max-width:100px"><span class="small muted">min</span><button type="button" class="btn sm ghost" data-act="delbloc" data-i="${i}" aria-label="Retirer le bloc">✕</button></div>`).join("")}

    </div>

    </div>
    <div class="row"><button class="btn primary" type="submit">Enregistrer le planning</button></div>
  </form>`;
}

    </div>
    <div class="card stack"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Note à la main</h2>

      ${D.captures.length?`<div class="thumbs">${D.captures.map((c,i)=>`<span class="thumb"><img src="${esc(blobUrl(c))}" alt="Capture"><button class="del" data-act="delcapture" data-i="${i}" aria-label="Retirer la capture">✕</button></span>`).join("")}</div>`:""}

function errTxt(x){return x.code+(x.lettre?" "+x.lettre:"")+(x.v?" (v."+x.v+")":"")}
function nbVersets(d,f){
  if(!d||!d.s||!f||!f.s)return 0;
  const a=+d.s,b=+f.s,va=+d.v||1,vb=+f.v||SOURATES[b-1][2];
  if(a===b)return Math.max(0,vb-va+1);
  let n=0,step=a<b?1:-1;
  if(step===1){n+=SOURATES[a-1][2]-va+1;for(let s=a+1;s<b;s++)n+=SOURATES[s-1][2];n+=vb}
  else{n+=SOURATES[a-1][2]-va+1;for(let s=a-1;s>b;s--)n+=SOURATES[s-1][2];n+=vb}
  return n;
}
function passageTxt(s){
  if(!s.debut||!s.debut.s)return "";
  const d=sN(s.debut.s)+(s.debut.v?" "+s.debut.v:"");
  if(!s.fin||!s.fin.s)return "À partir de "+d;
  const f=sN(s.fin.s)+(s.fin.v?" "+s.fin.v:"");
  const n=nbVersets(s.debut,s.fin);
  return "De "+d+" à "+f+(n?" ("+n+" versets)":"");
}
function statutsTxt(s){const g={};Object.entries(s.statuts||{}).forEach(([n,k])=>(g[k]=g[k]||[]).push(sN(+n)));return Object.entries(ETATS).filter(([k])=>g[k]).map(([k,l])=>l+" : "+g[k].join(", ")).join(" · ")}
function resumeCourt(s){return [passageTxt(s),statutsTxt(s),(s.erreurs||[]).length?"À travailler : "+s.erreurs.map(errTxt).join(", "):""].filter(Boolean).join(" · ")||s.note||"Cours noté"}
function resumeWa(s,e){
  const l=[salut(e),"",(enf(e)?`Compte rendu du cours de ${e.prenom} du ${fmtDate(s.date)} :`:`Compte rendu de votre cours du ${fmtDate(s.date)} :`)];
  if(passageTxt(s))l.push("• Passage : "+passageTxt(s));
  if(statutsTxt(s))l.push("• "+statutsTxt(s));
  if((s.erreurs||[]).length)l.push("• À travailler : "+s.erreurs.map(errTxt).join(", "));
  if(s.aFaire)l.push("• À réviser : "+s.aFaire);
  if(s.type==="lecture"&&s.fin&&s.fin.s)l.push("• Prochaine lecture : "+repriseTxt(s.fin));
  l.push("","BarakAllahu fikoum");return l.join("\n");
}
function suivant(f){let s=+f.s,v=(+f.v||SOURATES[s-1][2])+1;if(v>SOURATES[s-1][2]){s=s<114?s+1:1;v=1}return {s,v}}
function repriseTxt(f){const n=suivant(f);return sN(n.s)+" "+n.v}

function typeAudio(f){return /webm|ogg/i.test(f.type+f.name)?"video/webm":"video/mp4"}
function extAudio(f){if(MODE!=="db"){const m=(f.name||"").match(/\.([a-z0-9]{2,4})$/i);if(m)return m[1].toLowerCase();return /webm/.test(f.type)?"webm":"m4a"}return /webm|ogg/i.test(f.type+f.name)?"webm":"mp4"}
async function reduireImage(file,max=1800){
  try{const bmp=await createImageBitmap(file);const k=Math.min(1,max/Math.max(bmp.width,bmp.height));const c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(bmp,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(r,"image/jpeg",.85))}catch(e){return file}
}

/* ---------- enregistrement au micro (fichier ouvert sur la tablette) ---------- */
let REC=null;
const peutEnregistrer=()=>MODE!=="db"&&!!(window.MediaRecorder&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);
const recLabel=()=>REC?`■ Arrêter <span id="rectime">${fmtDuree((Date.now()-REC.start)/1000)}</span>`:"● Enregistrer au micro";
const fmtDuree=s=>Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0");
async function toggleRec(){
  if(REC){REC.mr.stop();return}
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){toast("Micro refusé. Autorisez le micro pour cette page, ou importez un audio du dictaphone.");return}
  const mr=new MediaRecorder(stream),chunks=[],ctx=R.view;
  REC={mr,start:Date.now(),t:setInterval(()=>{const el=$("#rectime");if(el&&REC)el.textContent=fmtDuree((Date.now()-REC.start)/1000)},500)};
  mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  mr.onstop=async()=>{
    stream.getTracks().forEach(t=>t.stop());clearInterval(REC.t);const dur=(Date.now()-REC.start)/1000;REC=null;
    const type=mr.mimeType||(chunks[0]&&chunks[0].type)||"audio/mp4";const blob=new Blob(chunks,{type});
    const ext=/webm/.test(type)?"webm":/ogg/.test(type)?"ogg":"m4a";
    const nom="Enregistrement "+new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
    if(ctx==="cours"&&DRAFT){try{const id=await upload(blob);DRAFT.audios.push({id,titre:nom+" ("+fmtDuree(dur)+")",propre:true,ext})}catch(e){toast("Audio non gardé.")}render(true)}
    else{R.recBlob={blob,ext,dur,url:URL.createObjectURL(blob)};render(true)}
  };
  mr.start(1000);render(true);
}

async function importer(){
  const d=R.importData;if(!d)return;
  toast("Restauration…");
  for(const k of Object.keys(URLS))await delAsset(k);

  COLS.forEach(c=>{S[c]=(d.data&&d.data[c])||{};persistLocal(c)});
  R.importData=null;toast("Sauvegarde restaurée.");go("today");
}

/* ---------- zone d'écriture ---------- */
function setupPad(){
  const cv=$("#pad");if(!cv)return;
  const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
  cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);
  PAD={cv,ctx:cv.getContext("2d"),dpr,w:r.width,h:r.height,cur:null,pen:false};
  redrawPad();
  cv.onpointerdown=e=>{if(e.pointerType==="pen")PAD.pen=true;if(PAD.pen&&e.pointerType==="touch")return;cv.setPointerCapture(e.pointerId);PAD.cur={c:PEN.c,w:PEN.w,ratio:PAD.h/PAD.w,p:[pt(e)]};DRAFT.strokes.push(PAD.cur);e.preventDefault()};
  cv.onpointermove=e=>{if(!PAD.cur)return;const co=e.getCoalescedEvents?e.getCoalescedEvents():[],evs=co.length?co:[e];evs.forEach(x=>PAD.cur.p.push(pt(x)));drawStroke(PAD.ctx,PAD.cur,PAD.w*PAD.dpr,PAD.h*PAD.dpr,PAD.dpr,true);e.preventDefault()};
  cv.onpointerup=cv.onpointercancel=()=>{PAD.cur=null};
  function pt(e){const b=cv.getBoundingClientRect();return [(e.clientX-b.left)/b.width,(e.clientY-b.top)/b.height,e.pressure||.5]}
}
window.addEventListener("resize",()=>{if(R.view==="cours"&&PAD){clearTimeout(setupPad.t);setupPad.t=setTimeout(setupPad,150)}});
function redrawPad(){if(!PAD)return;const{ctx,cv}=PAD;ctx.clearRect(0,0,cv.width,cv.height);DRAFT.strokes.forEach(s=>drawStroke(ctx,s,cv.width,cv.height,PAD.dpr))}
function drawStroke(ctx,s,W,H,scale,last){
  ctx.strokeStyle=s.c;ctx.lineCap="round";ctx.lineJoin="round";
  const p=s.p;if(p.length===1){ctx.fillStyle=s.c;ctx.beginPath();ctx.arc(p[0][0]*W,p[0][1]*H,s.w*scale*.6,0,7);ctx.fill();return}
  const start=last?Math.max(1,p.length-6):1;
  for(let i=start;i<p.length;i++){ctx.lineWidth=s.w*scale*(.55+p[i][2]);ctx.beginPath();ctx.moveTo(p[i-1][0]*W,p[i-1][1]*H);ctx.lineTo(p[i][0]*W,p[i][1]*H);ctx.stroke()}
}
function bornes(strokes){let y0=1,y1=0;strokes.forEach(s=>s.p.forEach(q=>{y0=Math.min(y0,q[1]);y1=Math.max(y1,q[1])}));return [Math.max(0,y0-.04),Math.min(1,y1+.04)]}
function exportPad(){
  if(!DRAFT.strokes.length)return null;
  const W=1400,H=Math.round(W*(PAD?PAD.h/PAD.w:.25));
  const [y0,y1]=bornes(DRAFT.strokes);const top=Math.floor(y0*H),hh=Math.max(60,Math.ceil((y1-y0)*H));
  const c=document.createElement("canvas");c.width=W;c.height=hh;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,W,hh);x.translate(0,-top);
  DRAFT.strokes.forEach(s=>drawStroke(x,s,W,H,W/(PAD?PAD.w:700)));
  return c;
}

/* ---------- terminer le cours ---------- */
async function terminerCours(){
  const D=DRAFT,e=S.eleves[D.eleveId];
  const btn=document.querySelector('[data-act="terminer"]');if(btn){btn.disabled=true;btn.textContent="Enregistrement…"}
  let dessin=null;
  const c=exportPad();
  if(c){try{const blob=await new Promise(r=>c.toBlob(r,"image/png"));dessin=await upload(blob,"image/png")}catch(x){toast("La note à la main n'a pas pu être gardée.")}}
  const id=uid(),now=new Date();
  const seance={eleveId:D.eleveId,date:now.toISOString(),duree:Math.round((Date.now()-D.start)/60000),type:D.type,debut:{s:+D.debut.s||null,v:+D.debut.v||null},fin:{s:+D.fin.s||null,v:+D.fin.v||null},statuts:D.statuts,erreurs:D.erreurs,note:D.note,dessin,captures:D.captures,audios:D.audios,aFaire:D.aFaire,paye:!!D.paye,cree:now.toISOString()};
  const planning=D.planning.filter(b=>(b.titre||"").trim()).map(b=>({titre:b.titre.trim(),min:+b.min||0}));
  const objectifs=String(D.objectifs||"").split("\n").map(s=>s.trim()).filter(Boolean);
  seance.planning=planning;seance.objectifs=objectifs;seance.sourateSemaine=+D.sourateSemaine||null;
  save("seances",id,seance);
  const maj={...e,sourates:{...(e.sourates||{}),...D.statuts},ouOnEnEst:D.ouOnEnEst||e.ouOnEnEst||"",aFaire:D.aFaire||"",derniere:now.toISOString(),planning,objectifs,sourateSemaine:+D.sourateSemaine||null};
  if(seance.type==="lecture"&&seance.fin.s)maj.reprise=suivant(seance.fin);
  save("eleves",D.eleveId,maj);
  if(D.paye&&e.tarifMode!=="seance"){const k=D.eleveId+"_"+moisKey();save("paiements",k,{eleveId:D.eleveId,mois:moisKey(),paye:true,montant:+e.tarif||0,date:now.toISOString()})}
  DRAFT=null;PAD=null;go("bilan",{id,nouveau:true});
}

/* ---------- dessins sur canvas (planning, PDF) ---------- */
async function polices(){try{await Promise.all(["700 40px Literata","500 40px Literata","400 30px Figtree","600 30px Figtree","400 40px Amiri","700 40px Amiri"].map(f=>document.fonts.load(f)))}catch(e){}}
function lignes(ctx,text,maxW){const out=[];String(text||"").split("\n").forEach(par=>{let l="";par.split(/\s+/).forEach(w=>{const t=l?l+" "+w:w;if(ctx.measureText(t).width>maxW&&l){out.push(l);l=w}else l=t});out.push(l)});return out}
function rrect(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
const loadImg=src=>new Promise(ok=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>ok(null);i.src=src});
async function dessinerPlanning(e){
  await polices();
  const W=1600,P=70,bl=e.planning,tot=bl.reduce((a,b)=>a+(+b.min||0),0),obj=e.objectifs||[];
  const cols=Math.min(4,bl.length),rowsB=Math.ceil(bl.length/cols),cw=(W-2*P-(cols-1)*24)/cols;
  const H=360+rowsB*230+(obj.length?110+obj.length*58:0)+(e.sourateSemaine?100:0)+190;
  const c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
  x.fillStyle="#f8f4ec";x.fillRect(0,0,W,H);
  x.strokeStyle="#c9a85e";x.lineWidth=3;rrect(x,24,24,W-48,H-48,28);x.stroke();
  x.fillStyle="#1f3a2c";x.font="700 70px Literata";x.textAlign="center";x.fillText("Planning de révision",W/2,150);
  x.fillStyle="#8a6a25";x.font="700 70px Literata";x.fillText("de "+e.prenom,W/2,232);
  x.fillStyle="#2f5240";x.font="600 36px Figtree";x.fillText(tot+" minutes par jour",W/2,295);
  x.textAlign="left";
  bl.forEach((b,i)=>{const cx=P+(i%cols)*(cw+24),cy=340+Math.floor(i/cols)*230;x.fillStyle=BLOC_COULEURS[i%6];rrect(x,cx,cy,cw,200,22);x.fill();
    x.fillStyle="#1f2a24";x.font="700 46px Literata";x.textAlign="center";x.fillText(b.min+" min",cx+cw/2,cy+66);
    x.font="400 30px Figtree";const L=lignes(x,b.titre,cw-36).slice(0,3);L.forEach((l,k)=>x.fillText(l,cx+cw/2,cy+112+k*36));x.textAlign="left"});
  let y=340+rowsB*230+20;
  if(e.sourateSemaine){x.fillStyle="#eaf0e6";rrect(x,P,y,W-2*P,80,18);x.fill();x.fillStyle="#1f3a2c";x.font="600 32px Figtree";x.fillText("Sourate de la semaine : "+sN(e.sourateSemaine),P+30,y+52);x.font="700 42px Amiri";x.textAlign="right";x.fillText(sAr(e.sourateSemaine),W-P-30,y+54);x.textAlign="left";y+=100}
  if(obj.length){x.fillStyle="#f3e8d4";const h=80+obj.length*58;rrect(x,P,y,W-2*P,h,22);x.fill();x.fillStyle="#5b3d10";x.font="700 40px Literata";x.fillText("Rappel des objectifs",P+30,y+58);
    x.font="400 32px Figtree";obj.forEach((o,k)=>{const yy=y+112+k*58;x.fillStyle="#2f5240";x.beginPath();x.arc(P+48,yy-10,16,0,7);x.fill();x.strokeStyle="#fff";x.lineWidth=4;x.beginPath();x.moveTo(P+40,yy-10);x.lineTo(P+46,yy-3);x.lineTo(P+57,yy-18);x.stroke();x.fillStyle="#1f2a24";x.fillText(o,P+80,yy)});y+=h+20}
  x.textAlign="center";x.fillStyle="#2f5240";x.font="500 34px Literata";x.fillText("Petits efforts chaque jour = grands résultats",W/2,y+60);
  x.font="700 46px Amiri";x.fillStyle="#8a6a25";x.fillText("إن شاء الله",W/2,y+118);
  if(reg().profNom){x.font="400 26px Figtree";x.fillStyle="#5f6b63";x.fillText(reg().profNom,W/2,H-52)}
  return c;
}
async function creerPdf(sid){
  const s=S.seances[sid],e={id:s.eleveId,...(S.eleves[s.eleveId]||{prenom:"Élève"})},o=R.opts||{};
  if(!window.jspdf){toast("Le module PDF n'a pas pu se charger. Rechargez la page.");return}
  toast("Création du PDF…");await polices();
  const W=1240,H=1754,M=90,pages=[];let x,y;
  const prof=reg().profNom||"";
  const nouvellePage=()=>{const c=document.createElement("canvas");c.width=W;c.height=H;x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,W,H);pages.push(c);
    if(pages.length===1){x.fillStyle="#2f5240";x.fillRect(0,0,W,250);x.fillStyle="#c9a85e";x.fillRect(0,250,W,6);x.fillStyle="#fff";x.font="700 58px Literata";x.fillText("Compte rendu de cours",M,120);x.font="400 30px Figtree";x.fillText(e.prenom+" · "+fmtLong(s.date)+" · "+(TYPES[s.type]||""),M,180);if(prof){x.globalAlpha=.85;x.fillText(prof,M,222);x.globalAlpha=1}y=320}
    else{x.fillStyle="#2f5240";x.font="600 26px Figtree";x.fillText("Compte rendu · "+e.prenom+" · "+fmtDate(s.date),M,80);x.fillStyle="#c9a85e";x.fillRect(M,100,W-2*M,3);y=150}};
  const besoin=h=>{if(y+h>H-110)nouvellePage()};
  const titre=t=>{besoin(90);x.fillStyle="#8a6a25";x.font="600 24px Figtree";x.fillText(t.toUpperCase(),M,y);y+=18;x.fillStyle="#eadfc8";x.fillRect(M,y,W-2*M,2);y+=44};
  const texte=(t,f="400 30px Figtree",col="#1f2a24")=>{x.font=f;x.fillStyle=col;lignes(x,t,W-2*M).forEach(l=>{besoin(42);x.fillText(l,M,y);y+=42});y+=18};
  const image=async(src,maxH=900)=>{const im=await loadImg(src);if(!im)return;let w=W-2*M,h=im.height*w/im.width;if(h>maxH){h=maxH;w=im.width*h/im.height}besoin(h+20);x.strokeStyle="#e3ddd0";x.lineWidth=2;x.drawImage(im,M,y,w,h);x.strokeRect(M,y,w,h);y+=h+30};
  nouvellePage();
  if(passageTxt(s)){titre("Passage travaillé");texte(passageTxt(s),"500 34px Literata")}
  if(statutsTxt(s)){titre("Bilan");Object.entries(ETATS).forEach(([k,l])=>{const n=Object.entries(s.statuts||{}).filter(([,v])=>v===k).map(([m])=>+m);if(n.length)texte(l+" : "+n.map(m=>sN(m)+" ("+sAr(m)+")").join(", "))})}
  if((s.erreurs||[]).length){titre("Points à travailler");s.erreurs.forEach(r=>texte("• "+errTxt(r)))}
  if(s.aFaire){titre("À réviser avant le prochain cours");texte(s.aFaire,"500 32px Figtree","#2f5240")}
  if(s.type==="lecture"&&s.fin&&s.fin.s){titre("Prochaine lecture");texte("Reprendre à "+repriseTxt(s.fin))}
  if(o.note&&s.note){titre("Note de l'enseignante");texte(s.note)}
  if(o.dessin&&s.dessin){titre("Note à la main");await image(blobUrl(s.dessin),700)}
  const pl=s.planning||e.planning||[],ob=s.objectifs||e.objectifs||[],sem=s.planning?s.sourateSemaine:e.sourateSemaine;
  if(o.planning&&(pl.length||sem)){titre("Planning de la semaine");if(pl.length)texte(pl.map(b=>b.min+" min · "+b.titre).join("\n")+"\nTotal : "+pl.reduce((a,b)=>a+(+b.min||0),0)+" min par jour");if(sem)texte("Sourate de la semaine : "+sN(sem)+" ("+sAr(sem)+")","500 30px Figtree","#2f5240");if(ob.length)texte("Objectifs : "+ob.join(" · "),"400 28px Figtree","#5f6b63")}
  if(o.captures&&(s.captures||[]).length){titre("Pages annotées");for(const cId of s.captures)await image(blobUrl(cId),1250)}
  pages.forEach((c,i)=>{const g=c.getContext("2d");g.fillStyle="#8a8f88";g.font="400 22px Figtree";g.textAlign="left";g.fillText(prof?prof+" · BarakAllahu fikoum":"BarakAllahu fikoum",M,H-50);g.textAlign="right";g.fillText("Page "+(i+1)+" / "+pages.length,W-M,H-50);g.textAlign="left"});
  const pdf=new window.jspdf.jsPDF({unit:"pt",format:"a4"});
  pages.forEach((c,i)=>{if(i)pdf.addPage();pdf.addImage(c.toDataURL("image/jpeg",.88),"JPEG",0,0,595.28,841.89)});
  const blob=pdf.output("blob");
  let pdfId=null;
  if(ASSETS||IDB){try{pdfId=await upload(blob,"application/pdf")}catch(err){toast("PDF créé mais non rangé dans la fiche.")}}
  if(pdfId){if(s.pdf)await delAsset(s.pdf);save("seances",sid,{...S.seances[sid],pdf:pdfId});render(true)}
  await saveFile(`Compte rendu ${e.prenom} ${s.date.slice(0,10)}.pdf`,blob);
}

/* ---------- démarrage ---------- */
async function boot(){
  render(true);
  let c=window.claude;
  if(location.protocol!=="file:"&&window.top!==window)for(let i=0;i<30&&!(c&&c.use);i++){await new Promise(r=>setTimeout(r,100));c=window.claude}
  if(!c||!c.use){await loadLocal();READY=true;render(true);return}
  const [db,assets,dl]=await Promise.all(["db","assets","downloads"].map(n=>c.use(n).catch(()=>null)));
  ASSETS=assets;DL=dl;
  if(!db){await loadLocal();READY=true;render(true);return}
  DB=db;MODE="db";
  let restants=COLS.length;
  const fin=()=>{if(--restants===0){READY=true;render(true)}};
  COLS.forEach(col=>{let first=true;db.collection(col).onSnapshot(snap=>{const o={};snap.docs.forEach(d=>o[d.id]=d.data());S[col]=o;if(first){first=false;fin()}else render()},err=>{toast("Connexion aux données perdue. Rechargez la page.");if(first){first=false;fin()}})});
  setTimeout(()=>{if(!READY){READY=true;render(true)}},8000);
}
boot();
</script>
